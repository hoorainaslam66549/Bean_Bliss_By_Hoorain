<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Bean Bliss</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"><link rel="stylesheet" href="style.css"></head>
<body><header class="header"><a class="logo" href="index.html"><span class="logo-mark">☕</span><span>Bean <b>Bliss</b></span></a><nav class="nav"><a href="index.html">Home</a><a href="products.html">Products</a><a href="contact.html">Contact</a></nav><a class="cart-btn" href="cart.html">🛒 Cart <span class="cart-count">0</span></a></header>
<main><section class="page-hero compact"><p class="eyebrow">SECURE CHECKOUT</p><h1>Complete your <em>order.</em></h1></section><section class="checkout-layout section"><form id="checkoutForm" class="checkout-form"><h2>Customer Details</h2><div class="form-grid"><label>Full Name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" type="tel" required></label><label>City<input id="city" value="Karachi" required></label></div><label>Delivery Address<textarea id="address" rows="3" required></textarea></label><h2>Payment Gateway</h2><div class="gateway-grid"><label class="gateway selected"><input type="radio" name="gateway" value="Card" checked><span>💳</span><b>Card</b><small>Visa / Mastercard</small></label><label class="gateway"><input type="radio" name="gateway" value="JazzCash"><span>📱</span><b>JazzCash</b><small>Mobile wallet</small></label><label class="gateway"><input type="radio" name="gateway" value="Easypaisa"><span>💚</span><b>EasyPaisa</b><small>Mobile wallet</small></label></div><div id="cardFields" class="form-grid"><label>Card Number<input inputmode="numeric" placeholder="0000 0000 0000 0000" maxlength="19"></label><label>Expiry<input placeholder="MM/YY" maxlength="5"></label><label>CVV<input type="password" inputmode="numeric" maxlength="4"></label></div><button class="btn primary wide" type="submit">Pay & Place Order</button><p class="secure">Demo only — no real payment is processed.</p></form><aside class="summary"><h2>Order Total</h2><div id="checkoutSummary"></div></aside></section></main><div class="modal" id="successModal"><div class="modal-box"><span class="success-icon">✓</span><h2>Order Confirmed!</h2><p id="orderMessage">Thank you for choosing Bean Bliss.</p><button class="btn primary" onclick="location.href='index.html'">Back to Home</button></div></div><div class="toast" id="toast"></div><script src="script.js"></script></body></html>
